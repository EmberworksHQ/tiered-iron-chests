plugins {
    // 'fabric-loom-remap' = Loom >= 1.14 plugin id for obfuscated MC versions (<= 1.21.11)
    id 'net.fabricmc.fabric-loom-remap'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    // Loom adds Fabric + Mojang mavens automatically.
}

loom {
    // Opens the handful of vanilla registration entry points that are private in the obfuscated jar (see the file).
    accessWidenerPath = file('src/main/resources/tieredironchests.accesswidener')

    // Mixin refmap (QA B1). Loom >= 1.11 no longer runs the Mixin annotation processor by default: remapJar rewrites
    // the annotation strings to intermediary in place (tiny-remapper mixin extension), which works but leaves no
    // refmap to audit in the artifact. Opt back into the AP so the Fabric jar carries the same, verifiable shape as
    // the Forge jar: <mod_id>.refmap.json (named -> intermediary) + a "refmap" key in the packaged mixin config.
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang mappings so common/ sources compile unchanged under both loaders.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    // Fabric API IS required on Fabric (declared in fabric.mod.json): the loader alone neither injects mod jars as
    // resource/data packs (fabric-resource-loader-v0) nor syncs registry ids to clients (fabric-registry-sync-v0).
    // A block/item mod needs both. Registration itself still goes through vanilla Registry.register.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// common/ is compiled into this jar (single shippable artifact, no jar-in-jar).
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
