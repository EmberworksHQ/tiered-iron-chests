# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom + IntelliJ config-cache issue: https://github.com/FabricMC/fabric-loom/issues/1349
# (whole build, since fabric/ and neoforge/ share this file)
org.gradle.configuration-cache=false

# Minecraft (Mojang ships Java 17 to end users in 1.20.1)
minecraft_version=1.20.1
java_version=17

# Fabric (docs/toolchain-matrix.md - Fabric 1.20.1)
loader_version=0.16.14
loom_version=1.17.20
fabric_api_version=0.92.12+1.20.1

# NeoForge (docs/toolchain-matrix.md - NeoForge 1.20.1)
# ModDevGradle LEGACY plugin (net.neoforged.moddev.legacyforge), same version line as the main plugin.
# NeoForge for 1.20.1 is published as net.neoforged:forge:<mc>-<forge_version> (NOT net.neoforged:neoforge).
moddev_version=2.0.146
minecraft_version_range=[1.20.1,1.21)
neo_version=1.20.1-47.1.106
neo_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Mod
mod_id=tieredironchests
mod_name=Tiered Iron Chests
mod_version=1.0.0
mod_license=MIT
mod_group_id=com.automods.tieredironchests

# Mixin annotation processor for refmap generation (same Mixin version Forge 47.1 ships at runtime)
mixin_version=0.8.5
